<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Engine</title>
    <meta name="description" content="Calculate the best price for your Back to the Future collection with our advanced pricing engine.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Pricing Engine</h1>

        <div class="input-group">
            <label for="cart-content">Enter your cart items (one per line):</label>
            <textarea id="cart-content" placeholder="Back to the Future 1&#10;Back to the Future 2&#10;Back to the Future 3&#10;La chèvre&#10;&#10;Press [⇥ Tab] to auto-fill"></textarea>
        </div>

        <button id="calculate-btn">Calculate Price</button>

        <div id="breakdown-container" class="breakdown-container" style="display: none;">
            <button id="breakdown-toggle" class="breakdown-toggle">&nbsp;&nbsp;&nbsp;&nbsp;Show Calculation Breakdown</button>
            <div id="breakdown-content" class="breakdown-content" style="display: none;">
                <div id="breakdown-items" class="breakdown-items"></div>
                <div class="breakdown-summary">
                    <div class="summary-row">
                        <span>Back to the Future Subtotal:</span>
                        <span id="bttf-subtotal">€0.00</span>
                    </div>
                    <div class="summary-row" id="discount-row" style="display: none;">
                        <span>Discount (<span id="discount-percent">0</span>%):</span>
                        <span id="discount-amount">-€0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Back to the Future Total:</span>
                        <span id="bttf-total">€0.00</span>
                    </div>
                    <div class="summary-row" id="other-row" style="display: none;">
                        <span>Other Movies Total:</span>
                        <span id="other-total">€0.00</span>
                    </div>
                    <div class="summary-row final">
                        <span>Total:</span>
                        <span id="summary-total">€0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="result-container" class="result">
            <div id="price-display">0.00</div>
        </div>
    </div>

    <footer>
        &copy; 2026 DVD Store.
    </footer>

    <script src="app.js"></script>
</body>
</html>
